name: CarOs manual signed IPA (no upload)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: car-os-manual-sign
  cancel-in-progress: false

jobs:
  signed-ipa:
    # Manual run only. The source is pinned to an inspected commit; change only after review.
    # Do not expose any secrets to PR-triggered workflows.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed CarOs prototype branch
        uses: actions/checkout@v4
        with:
          ref: 70eb23438d8e91d4d62879c770bb51606456cf9b
          persist-credentials: false

      - name: Print reviewed source commit and check safety invariants
        shell: bash
        run: |
          git rev-parse HEAD
          python3 scripts/check_source.py

      - name: Sign and export IPA (no Apple upload)
        shell: bash
        env:
          CAROS_P12_BASE64: ${{ secrets.CAROS_P12_BASE64 }}
          CAROS_P12_PASSWORD: ${{ secrets.CAROS_P12_PASSWORD }}
          CAROS_PROFILE_BASE64: ${{ secrets.CAROS_PROFILE_BASE64 }}
        run: bash scripts/build-caros-signed.sh

      - name: Save signed IPA for review
        uses: actions/upload-artifact@v4
        with:
          name: CarOs-signed-not-uploaded
          path: build/signed-export/*.ipa
          if-no-files-found: error
          retention-days: 1
