name: CarOs TestFlight internal upload (manual)
on:
  workflow_dispatch:

# Intentionally not triggered by push or pull_request.
permissions:
  contents: read

concurrency:
  group: car-os-testflight-manual-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout reviewed CarOs source
        uses: actions/checkout@v4
        with:
          # Pinned; do not use mutable PR HEAD while secrets are available.
          ref: 04767dc3b834bcf0915b4108ef4359ca57c8561c
          persist-credentials: false

      - name: Validate CarOs safety invariants
        run: python3 scripts/check_source.py

      - name: Build and export signed iPhone IPA
        env:
          CAROS_P12_BASE64: ${{ secrets.CAROS_P12_BASE64 }}
          CAROS_P12_PASSWORD: ${{ secrets.CAROS_P12_PASSWORD }}
          CAROS_PROFILE_BASE64: ${{ secrets.CAROS_PROFILE_BASE64 }}
        run: bash scripts/build-caros-signed.sh

      - name: Upload ONLY to App Store Connect (TestFlight processing)
        shell: bash
        env:
          CAROS_ASC_API_KEY_ID: ${{ secrets.CAROS_ASC_API_KEY_ID }}
          CAROS_ASC_ISSUER_ID: ${{ secrets.CAROS_ASC_ISSUER_ID }}
          CAROS_ASC_API_KEY_P8_BASE64: ${{ secrets.CAROS_ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          for var in CAROS_ASC_API_KEY_ID CAROS_ASC_ISSUER_ID CAROS_ASC_API_KEY_P8_BASE64; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::Missing App Store Connect API secret $var"
              exit 1
            fi
          done
          if [[ ! "$CAROS_ASC_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::Malformed App Store Connect API Key ID"
            exit 1
          fi
          if [[ ! "$CAROS_ASC_ISSUER_ID" =~ ^[a-fA-F0-9-]{36}$ ]]; then
            echo "::error::Malformed App Store Connect Issuer ID"
            exit 1
          fi
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          key_file="$key_dir/AuthKey_${CAROS_ASC_API_KEY_ID}.p8"
          printf '%s' "$CAROS_ASC_API_KEY_P8_BASE64" | base64 -D > "$key_file"
          chmod 600 "$key_file"
          grep -q 'BEGIN PRIVATE KEY' "$key_file" || {
            echo "::error::Invalid p8 API key file"
            exit 1
          }
          shopt -s nullglob
          ipas=(build/signed-export/*.ipa)
          if [[ ${#ipas[@]} -ne 1 ]]; then
            echo "::error::Expected precisely one signed CarOs IPA"
            exit 1
          fi
          # This submits the binary for internal TestFlight processing ONLY.
          # It does not invite external testers or publish to the App Store.
          xcrun altool --upload-app -f "${ipas[0]}" -t ios \
            --apiKey "$CAROS_ASC_API_KEY_ID" \
            --apiIssuer "$CAROS_ASC_ISSUER_ID"
          rm -f "$key_file"
          echo "Upload requested: check CarOs > TestFlight > Builds in App Store Connect."

      - name: Save IPA for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarOs-testflight-candidate
          path: build/signed-export/*.ipa
          if-no-files-found: ignore
          retention-days: 1
